<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Acceso — Fiesta del Padre Santiago</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f5f1;
      color: #2f2f2f;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 25px 18px 40px;
      text-align: center;
    }

    h1 {
      margin: 10px 0 5px;
      font-size: 27px;
      font-weight: 700;
    }

    .subtitle {
      margin: 0 0 25px;
      color: #777;
      font-size: 16px;
    }

    #reader {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    .status {
      margin: 20px 0;
      padding: 18px;
      border-radius: 15px;
      background: white;
      font-size: 17px;
      line-height: 1.5;
    }

    .success {
      background: #e8f6ea;
      color: #236b32;
    }

    .error {
      background: #fdeaea;
      color: #9c2525;
    }

    .warning {
      background: #fff5df;
      color: #8a5a00;
    }

    .button {
      display: none;
      width: 100%;
      border: none;
      border-radius: 13px;
      padding: 16px;
      font-size: 17px;
      font-weight: 600;
      background: #333;
      color: white;
      cursor: pointer;
      margin-top: 15px;
    }

    .button:active {
      transform: scale(.98);
    }

    .folio {
      font-size: 14px;
      color: #777;
      margin-top: 10px;
    }

    .nombre {
      font-size: 22px;
      font-weight: 700;
      margin: 8px 0;
    }

    .personas {
      font-size: 18px;
      margin-top: 8px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Fiesta del Padre Santiago</h1>

  <p class="subtitle">
    Control de acceso
  </p>

  <div id="reader"></div>

  <div id="resultado" class="status">
    Apunta la cámara al código QR de la invitación.
  </div>

  <button id="siguiente" class="button" onclick="reiniciarEscaner()">
    Escanear siguiente pase
  </button>

</div>

<script>

  const URL_APPS_SCRIPT =
    "https://script.google.com/macros/s/AKfycbwwDMj6luhnPY2wY2ZelBFbj-zqr71Witb-HfiLUzfSWdhKzeJfOV3-lc44DYcE896O/exec";

  let scanner = null;
  let procesando = false;

  function mostrarResultado(mensaje, tipo) {

    const resultado = document.getElementById("resultado");

    resultado.className = "status " + (tipo || "");

    resultado.innerHTML = mensaje;
  }

  function iniciarEscaner() {

    procesando = false;

    document.getElementById("siguiente").style.display = "none";

    mostrarResultado(
      "Apunta la cámara al código QR de la invitación.",
      ""
    );

    scanner = new Html5Qrcode("reader");

    scanner.start(
      {
        facingMode: "environment"
      },
      {
        fps: 10,
        qrbox: {
          width: 260,
          height: 260
        }
      },
      function(decodedText) {

        if (procesando) return;

        procesando = true;

        detenerCamara(function() {
          validarQR(decodedText);
        });

      },
      function(errorMessage) {
        // Ignoramos los pequeños errores normales mientras busca el QR.
      }
    ).catch(function(error) {

      mostrarResultado(
        "No se pudo abrir la cámara.<br><br>" +
        "Revisa que Safari tenga permiso para utilizar la cámara.",
        "error"
      );

      document.getElementById("siguiente").style.display = "block";
    });
  }


  function detenerCamara(callback) {

    if (!scanner) {
      callback();
      return;
    }

    scanner.stop()
      .then(function() {
        callback();
      })
      .catch(function() {
        callback();
      });
  }


  function validarQR(textoQR) {

    let folio = textoQR;

    /*
      Si el QR contiene:

      FIESTA PADRE SANTIAGO|PS-0001

      tomamos solamente:

      PS-0001
    */

    if (textoQR.includes("|")) {

      const partes = textoQR.split("|");

      folio = partes[partes.length - 1];

    }

    folio = folio.trim();

    mostrarResultado(
      "Validando invitación...",
      ""
    );

    fetch(
      URL_APPS_SCRIPT +
      "?folio=" +
      encodeURIComponent(folio)
    )
    .then(function(response) {
      return response.json();
    })
    .then(function(data) {

      mostrarResultadoFinal(data);

    })
    .catch(function(error) {

      mostrarResultado(
        "No se pudo conectar con el sistema.<br><br>" +
        "Revisa la conexión a internet.",
        "error"
      );

      document.getElementById("siguiente").style.display = "block";

    });
  }


  function mostrarResultadoFinal(data) {

  let mensaje = "";

  if (data.ok) {

    mensaje =
      "✓ ENTRADA AUTORIZADA" +
      "<div class='nombre'>" +
      escaparHTML(data.nombre) +
      "</div>" +
      "<div class='folio'>Folio: " +
      escaparHTML(data.folio) +
      "</div>";

    mostrarResultado(mensaje, "success");

  }

  else if (data.tipo === "usado") {

    mensaje =
      "⚠️ ESTE PASE YA FUE UTILIZADO" +
      "<div class='nombre'>" +
      escaparHTML(data.nombre) +
      "</div>" +
      "<div class='folio'>" +
      "Entrada registrada: " +
      escaparHTML(data.horaEntrada || "") +
      "</div>";

    mostrarResultado(mensaje, "error");

  }

  else if (data.tipo === "no_confirmado") {

    mensaje =
      "⚠️ INVITACIÓN NO CONFIRMADA" +
      "<div class='nombre'>" +
      escaparHTML(data.nombre || "") +
      "</div>";

    mostrarResultado(mensaje, "warning");

  }

  else {

    mostrarResultado(
      "✕ FOLIO NO ENCONTRADO",
      "error"
    );

  }

  document.getElementById("siguiente").style.display = "block";
}

  function escaparHTML(texto) {

    return String(texto || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function reiniciarEscaner() {

    document.getElementById("reader").innerHTML = "";

    iniciarEscaner();

  }


  window.onload = function() {

    iniciarEscaner();

  };

</script>

</body>
</html>
